<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba Netlify Android</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0e8388, #2e4f4f);
            color: #white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: white;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 300px;
        }
        h1 { font-size: 1.5rem; margin-bottom: 10px; }
        p { font-size: 0.9rem; opacity: 0.9; }
        .btn {
            background-color: #00adb5;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
        }
        .btn:active { background-color: #007e85; }
    </style>
</head>
<body>

    <div class="card">
        <h1>🚀 ¡Netlify Funciona!</h1>
        <p>Esta es una web de prueba lista para ser desplegada y abierta desde tu móvil Android.</p>
        <button class="btn" onclick="saludar()">¡Púlsame!</button>
    </div>

    <script>
        function saludar() {
            alert("¡Hola desde Android! Netlify está funcionando a la perfección.");
        }
    </script>

</body>
</html>
